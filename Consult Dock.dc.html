<body>

  <sc-if value="{{ dockOpen }}" hint-placeholder-val="{{ false }}">

      <a href="reserve.html" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">온라인 예약 신청<span style="font-size: 12px; color: #8B948F;">→</span></a>
      <a href="reserve.html#channels" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">카카오톡 상담<span style="font-size: 11px; color: #8B948F;">KakaoTalk</span></a>
      <a href="reserve.html#channels" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">WhatsApp<span style="font-size: 11px; color: #8B948F;">Global</span></a>
      <a href="reserve.html#channels" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">LINE<span style="font-size: 11px; color: #8B948F;">Global</span></a>
      <a href="reserve.html#channels" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">인스타그램 DM<span style="font-size: 11px; color: #8B948F;">@alldetail</span></a>
      <a href="about.html#location" onClick="{{ closeDock }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; border-top: 1px solid #EDF0EE; font-size: 13.5px; font-weight: 500;" style-hover="background: #ECF2F0; color: #2C7A6B;">오시는 길<span style="font-size: 12px; color: #8B948F;">→</span></a>
    </div>

      <svg viewBox="0 0 173.61 173.5" style="width: 27px; height: 27px; display: block;" aria-hidden="true">
        <g fill="currentColor">
          <path d="M152.6,86.32c-5.52.73-11.08.43-16.63.8l-45.43.33-5.96-4.14,2.49-54.1,1.11-15.12,1.85,23.62s2.52,30.87,2.53,30.93c.67,8.19,9.56,10.9,16.39,12.05,7.47,1.26,15.01,2.04,22.53,2.88,7.05.78,14.13,1.93,21.13,2.76h0Z"></path>
          <path d="M80.63,104.99c-.6-6.41-5.79-9.64-11.49-11.23-7.48-2.08-15.34-2.54-23-3.64-7.65-1.09-15.29-2.18-22.94-3.28-.93-.13-1.87-.27-2.8-.4l62.78-.75,5.62,4.07-3.18,68.67s-4.98-53.37-4.99-53.45h0Z"></path>
          <path d="M88.14,8.49L88.32,0c-18.37-.19-36.42,4.91-51.8,15.92C15.86,30.72,2.62,54.07.32,79.39c-.66,7.26-.27,13.89.82,21.2l2.98-.65c-3.1-22.71,5.27-48.28,21.92-64.43,7.45-7.22,15.62-13.06,24.65-17.79,10.55-5.52,25.17-8.37,36.94-9.2,0,0,.28-.02.28-.02"></path>
          <path d="M171.93,69.52c-.87.12-1.92.16-2.79.28,1.12,6.77.89,13.19.08,19.99-1.83,15.35-6.95,29.51-16.76,41.49-8.55,10.43-18.97,18.9-30.96,25.18-8.56,4.48-17.84,7.63-27.43,8.57-4.29.16-7.24.27-7.24.27v8.21c19.62.06,39.6-7.24,54.45-19.22,2.7-2.18,5.62-4.74,8.03-7.24,2.38-2.49,4.64-5,6.7-7.76,2.04-2.74,3.99-5.5,5.69-8.48,1.7-2.97,3.37-6.08,4.71-9.22,1.34-3.14,2.51-6.16,3.48-9.44.97-3.28,1.77-6.6,2.38-9.98.61-3.41,1.03-7,1.27-10.46.12-1.74.05-3.57.07-5.31.07-4.32-.28-8.69-.97-12.95-.11-.69-.23-1.37-.37-2.06-.12-.6-.26-1.15-.33-1.84h0Z"></path>

      </svg>
    </sc-if>
    <sc-if value="{{ dockOpen }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 17px; line-height: 1;">✕</span>
    </sc-if>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false };

  componentDidMount() {
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ open: false }); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._esc); }

  renderVals() {
    return {
      dockOpen: this.state.open,
      dockClosed: !this.state.open,
      toggleDock: () => this.setState((s) => ({ open: !s.open })),
      closeDock: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
