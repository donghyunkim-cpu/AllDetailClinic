    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display: flex; align-items: center; gap: clamp(13px, 2vw, 30px); font-size: 12.5px; letter-spacing: 0.01em;">
        <a href="about.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">소개<sc-if value="{{ atAbout }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="signature.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">시그니처<sc-if value="{{ atSignature }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="treatments.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">시술<sc-if value="{{ atTreatments }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="column.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">메디컬 칼럼<sc-if value="{{ atColumn }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="about.html#location" style="display: flex; align-items: center;"><span style="display: block;">오시는 길</span></a>
      </nav>
      <div style="position: relative; flex: none;">
        <button onClick="{{ toggleLang }}" aria-label="언어 선택" aria-expanded="{{ langOpen }}" style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid {{ langBorder }}; background: {{ langBg }}; font-size: 11px; letter-spacing: 0.14em; color: #121614; cursor: pointer;" style-hover="border-color: #2C7A6B; color: #2C7A6B;">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; flex: none;"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"></path></g></svg>
          <span>{{ langCode }}</span>
          <span style="display: inline-block; font-size: 8px; color: #8B948F; transform: {{ langArrow }}; transition: transform .2s ease;">▼</span>
        </button>
        <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: calc(100% + 8px); right: 0; min-width: 178px; background: #F9FAF9; border: 1px solid #DCE2DF; box-shadow: 0 16px 40px rgba(10,18,16,0.13); padding: 6px; z-index: 90;">
            <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" onClick="{{ l.pick }}" style="display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; font-size: 13.5px; color: {{ l.tone }};" style-hover="background: #ECF2F0; color: #2C7A6B;">
                <span style="width: 22px; flex: none; font-size: 10px; letter-spacing: 0.12em; color: #A3ACA8;">{{ l.code }}</span>
                <span style="flex: 1;">{{ l.native }}</span>
                <span style="font-size: 12px; color: #5A6663;">{{ l.note }}</span>
              </a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleNav }}" aria-label="메뉴" style="display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 46px; height: 46px; padding: 0 11px; border: 0; background: transparent; cursor: pointer; flex: none;">
        <span style="display: block; width: 100%; height: 1px; background: #121614;"></span>
        <span style="display: block; width: 100%; height: 1px; background: #121614;"></span>
      </button>
    </sc-if>

  <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">

<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;signature&quot;,&quot;treatments&quot;,&quot;column&quot;,&quot;reserve&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// path-based locales so each language is indexable; flip `ready` as translations land
const LANGS = [
  { code: 'KO', native: '한국어', href: '/', ready: true },
  { code: 'EN', native: 'English', href: '/en/', ready: false },
  { code: 'CN', native: '中文', href: '/zh/', ready: false },
  { code: 'AR', native: 'العربية', href: '/ar/', ready: false }
];
const CURRENT = 'KO';

class Component extends DCLogic {
  state = { navOpen: false, scrolled: false, langOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1440 };

  componentDidMount() {
    this._resize = () => this.setState({ w: window.innerWidth });
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ navOpen: false, langOpen: false }); };
    this._away = (e) => {
      if (!this.state.langOpen) return;
      if (!e.target.closest || !e.target.closest('[aria-label="언어 선택"]')) {
        if (!e.target.closest || !e.target.closest('a[href]')) this.setState({ langOpen: false });
      }
    };
    document.addEventListener('click', this._away, true);
    this._scroll = () => {
      const on = (window.scrollY || document.documentElement.scrollTop || 0) > 24;
      if (on !== this.state.scrolled) this.setState({ scrolled: on });
      this._publish(on);
    };
    this._publish = (on) => {
      const h = on ? 60 : (window.innerWidth < 900 ? 76 : 92);
      document.documentElement.style.setProperty('--adc-header-h', h + 'px');
    };
    window.addEventListener('resize', this._resize);
    window.addEventListener('keydown', this._esc);
    window.addEventListener('scroll', this._scroll, { passive: true });
    this._scroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._resize);
    window.removeEventListener('keydown', this._esc);
    window.removeEventListener('scroll', this._scroll);
    if (this._away) document.removeEventListener('click', this._away, true);
    document.body.style.overflow = '';
  }
  componentDidUpdate() {
    document.body.style.overflow = this.state.navOpen ? 'hidden' : '';
  }

  renderVals() {
    const mobile = this.state.w < 900;
    const a = this.props.active || '';
    const big = !this.state.scrolled;
    return {
      headerH: big ? (mobile ? '76px' : '92px') : '60px',
      symSize: big ? (mobile ? '30px' : '38px') : '0px',
      symGap: big ? (mobile ? '9px' : '12px') : '0px',
      symOpacity: big ? 1 : 0,
      wordH: big ? (mobile ? '19px' : '25px') : '15px',
      isMobile: mobile,
      isDesktop: !mobile,
      navOpen: this.state.navOpen,
      toggleNav: () => this.setState((s) => ({ navOpen: !s.navOpen })),
      langOpen: this.state.langOpen,
      langCode: (LANGS.find((l) => l.code === CURRENT) || LANGS[0]).code,
      langArrow: this.state.langOpen ? 'rotate(180deg)' : 'none',
      langBorder: this.state.langOpen ? '#2C7A6B' : '#DCE2DF',
      langBg: this.state.langOpen ? '#ECF2F0' : 'transparent',
      toggleLang: () => this.setState((s) => ({ langOpen: !s.langOpen })),
      langs: LANGS.map((l) => {
        const on = l.code === CURRENT;
        return {
          code: l.code,
          native: l.native,
          note: on ? '현재' : (l.ready ? '' : '준비 중'),
          // only a ready, non-current locale is a real link — current is a no-op that just closes
          href: (l.ready && !on) ? l.href : '#',
          tone: on ? '#2C7A6B' : (l.ready ? '#121614' : '#7C8A85'),
          chipBorder: on ? '#2C7A6B' : '#DCE2DF',
          chipBg: on ? '#ECF2F0' : 'transparent',
          pick: (e) => {
            if (!l.ready || on) { e.preventDefault(); this.setState({ langOpen: false }); return; }
            this.setState({ langOpen: false });
          }
        };
      }),
      atAbout: a === 'about',
      atSignature: a === 'signature',
      atTreatments: a === 'treatments',
      atColumn: a === 'column'
    };
  }
}
</script>
