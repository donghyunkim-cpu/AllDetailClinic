<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&display=swap" />
<style>
  @font-face {
    font-family: 'SUIT Variable';
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.woff2') format('woff2-variations');
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #F9FAF9; color: #121614; -webkit-font-smoothing: antialiased; }
  a { color: #121614; text-decoration: none; }
  a:hover { color: #2C7A6B; }
  input, select, textarea, button { font-family: inherit; color: inherit; }
  ::selection { background: #D6E7E2; color: #121614; }
</style>
</helmet>

<div style="font-family: 'SUIT Variable', system-ui, sans-serif;">
  <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 80; display: flex; align-items: center; justify-content: space-between; gap: 20px; height: {{ headerH }}; padding: 0 clamp(16px, 3vw, 40px); background: rgba(249,250,249,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #E4E9E6; transition: height .34s cubic-bezier(.2,.8,.2,1);">
    <a href="index.html" style="display: flex; align-items: center; flex: none; overflow: hidden;">
      <img src="images/symbol.svg" alt="" style="height: {{ symSize }}; width: {{ symSize }}; margin-right: {{ symGap }}; opacity: {{ symOpacity }}; display: block; flex: none; transition: height .34s cubic-bezier(.2,.8,.2,1), width .34s cubic-bezier(.2,.8,.2,1), margin-right .34s cubic-bezier(.2,.8,.2,1), opacity .26s linear;" />
      <img src="images/logo.svg" alt="올디테일의원 ALL DETAIL CLINIC" style="height: {{ wordH }}; width: auto; display: block; flex: none; transition: height .34s cubic-bezier(.2,.8,.2,1);" />
    </a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display: flex; align-items: center; gap: clamp(13px, 2vw, 30px); font-size: 12.5px; letter-spacing: 0.01em;">
        <a href="about.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">소개<sc-if value="{{ atAbout }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <div onMouseEnter="{{ sigEnter }}" onMouseLeave="{{ sigLeave }}" style="position: relative; display: flex; align-items: center; align-self: stretch;">
          <a href="signature.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">시그니처<sc-if value="{{ atSignature }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
          <sc-if value="{{ sigOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% - 4px); left: -18px; min-width: 268px; background: #F9FAF9; border: 1px solid #DCE2DF; box-shadow: 0 16px 40px rgba(10,18,16,0.13); padding: 8px; z-index: 90;">
              <sc-for list="{{ sigs }}" as="s" hint-placeholder-count="7">
                <a href="{{ s.href }}" style="display: flex; align-items: baseline; gap: 12px; padding: 10px 12px; font-size: 13px;" style-hover="background: #ECF2F0; color: #2C7A6B;">
                  <span style="width: 20px; flex: none; font-family: 'Newsreader', serif; font-style: italic; font-size: 12px; color: #A3ACA8;">{{ s.no }}</span>
                  <span>{{ s.ko }}</span>
                </a>
              </sc-for>
              <a href="signature.html" style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding: 10px 12px; border-top: 1px solid #E4E9E6; font-size: 10.5px; letter-spacing: 0.16em; color: #2C7A6B;" style-hover="background: #ECF2F0; color: #2C7A6B;">ALL SIGNATURE <span>→</span></a>
            </div>
          </sc-if>
        </div>
        <a href="before-after.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">비포앤애프터<sc-if value="{{ atBa }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="treatments.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">시술<sc-if value="{{ atTreatments }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="column.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">메디컬 칼럼<sc-if value="{{ atColumn }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="concerns.html" style="display: flex; align-items: center;"><span style="position: relative; display: block;">피부고민<sc-if value="{{ atConcerns }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: #2C7A6B;"></span></sc-if></span></a>
        <a href="about.html#location" style="display: flex; align-items: center;"><span style="display: block;">오시는 길</span></a>
      </nav>
      <div style="position: relative; flex: none;">
        <button onClick="{{ toggleLang }}" aria-label="언어 선택" aria-expanded="{{ langOpen }}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid {{ langBorder }}; background: {{ langBg }}; font-size: 11px; letter-spacing: 0.14em; color: #121614; cursor: pointer;" style-hover="border-color: #2C7A6B; color: #2C7A6B;">
          <span>{{ langCode }}</span>
          <span style="display: inline-block; font-size: 8px; color: #8B948F; transform: {{ langArrow }}; transition: transform .2s ease;">▼</span>
        </button>
        <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px; background: #F9FAF9; border: 1px solid #DCE2DF; box-shadow: 0 16px 40px rgba(10,18,16,0.13); padding: 6px; z-index: 90;">
            <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" onClick="{{ l.pick }}" style="display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; font-size: 13.5px; color: {{ l.tone }};" style-hover="background: #ECF2F0; color: #2C7A6B;">
                <span style="width: 30px; flex: none; font-size: 10px; letter-spacing: 0.12em; color: #A3ACA8;">{{ l.code }}</span>
                <span style="flex: 1;">{{ l.native }}</span>
                <span style="font-size: 12px; color: #5A6663;">{{ l.note }}</span>
              </a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleNav }}" aria-label="메뉴" style="display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 46px; height: 46px; padding: 0 11px; border: 0; background: transparent; cursor: pointer; flex: none;">
        <span style="display: block; width: 100%; height: 1px; background: #121614;"></span>
        <span style="display: block; width: 100%; height: 1px; background: #121614;"></span>
      </button>
    </sc-if>
  </header>

  <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 95; background: #F9FAF9; padding: 0 22px; display: flex; flex-direction: column; overflow-y: auto;">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 60px; border-bottom: 1px solid #E4E9E6; flex: none;">
        <img src="images/logo.svg" alt="올디테일의원" style="height: 15px; width: auto; display: block;" />
        <button onClick="{{ toggleNav }}" aria-label="닫기" style="width: 46px; height: 46px; border: 0; background: transparent; font-size: 18px; cursor: pointer;">✕</button>
      </div>
      <nav style="display: flex; flex-direction: column; padding: 18px 0;">
        <a href="about.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">I.</span>올디테일 소개</a>
        <div style="border-bottom: 1px solid #EDF0EE;">
          <button onClick="{{ toggleSigAcc }}" aria-expanded="{{ sigAccOpen }}" style="appearance: none; width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; display: flex; align-items: baseline; gap: 14px; padding: 15px 0; font-size: 23px; font-weight: 600; letter-spacing: -0.035em; color: #121614;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">II.</span><span style="flex: 1;">올디테일 시그니처</span><span style="font-size: 18px; font-weight: 400; color: #8B948F;">{{ sigAccMark }}</span></button>
          <sc-if value="{{ sigAccOpen }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; padding: 2px 0 14px 30px;">
              <sc-for list="{{ sigs }}" as="s" hint-placeholder-count="7">
                <a href="{{ s.href }}" onClick="{{ toggleNav }}" style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; font-size: 16px; font-weight: 500; letter-spacing: -0.03em;">
                  <span style="width: 22px; flex: none; font-family: 'Newsreader', serif; font-style: italic; font-size: 12px; color: #B2BBB7;">{{ s.no }}</span>
                  <span>{{ s.ko }}</span>
                </a>
              </sc-for>
              <a href="signature.html" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10.5px; letter-spacing: 0.16em; color: #2C7A6B;">시그니처 소개 페이지 <span>→</span></a>
            </div>
          </sc-if>
        </div>
        <a href="before-after.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">III.</span>비포앤애프터</a>
        <a href="treatments.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">IV.</span>시술</a>
        <a href="column.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">V.</span>메디컬 칼럼</a>
        <a href="concerns.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">VI.</span>피부고민</a>
        <a href="reserve.html" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">VII.</span>예약하기</a>
        <a href="about.html#location" style="display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #EDF0EE; font-size: 23px; font-weight: 600; letter-spacing: -0.035em;"><span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #8B948F;">VIII.</span>오시는 길</a>
      </nav>
      <div style="margin-top: auto; padding: 20px 0 28px;">
        <p style="margin: 0 0 10px; font-size: 10px; letter-spacing: 0.2em; color: #A3ACA8;">LANGUAGE</p>
        <div style="display: flex; flex-wrap: wrap; gap: 7px;">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" onClick="{{ l.pick }}" style="display: flex; align-items: baseline; gap: 7px; padding: 10px 13px; border: 1px solid {{ l.chipBorder }}; background: {{ l.chipBg }}; font-size: 13px; color: {{ l.tone }};" style-hover="border-color: #2C7A6B; color: #2C7A6B;">
              <span style="font-size: 9.5px; letter-spacing: 0.12em; color: #A3ACA8;">{{ l.code }}</span>
              <span>{{ l.native }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;signature&quot;,&quot;ba&quot;,&quot;treatments&quot;,&quot;column&quot;,&quot;concerns&quot;,&quot;reserve&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// text-only locale codes (no flags by policy); flip `ready` as translations land
const LANGS = [
  { code: 'KR', native: '한국어', href: '/', ready: true },
  { code: 'EN', native: 'English', href: '/en/', ready: false },
  { code: '简体', native: '简体中文', href: '/zh-cn/', ready: false },
  { code: '繁體', native: '繁體中文', href: '/zh-tw/', ready: false }
];
const CURRENT = 'KR';
const SIG = 'signature.html#';
const SIGS = [
  { no: '01', ko: '올디테일 팔자지우개', key: 'nasolabial' },
  { no: '02', ko: '올디테일 땅콩필러', key: 'peanut' },
  { no: '03', ko: '올디테일 바디지우개', key: 'body' },
  { no: '04', ko: '올디테일 리프팅', key: 'lifting' },
  { no: '05', ko: '올디테일 줄기세포 수액', key: 'stem' },
  { no: '06', ko: '컴포트 스킨부스터', key: 'booster' },
  { no: '07', ko: '커스텀 색소지우개', key: 'pigment' }
];

class Component extends DCLogic {
  state = { navOpen: false, scrolled: false, langOpen: false, sigOpen: false, sigAccOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1440 };

  componentDidMount() {
    this._resize = () => this.setState({ w: window.innerWidth });
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ navOpen: false, langOpen: false, sigOpen: false }); };
    this._away = (e) => {
      if (!this.state.langOpen) return;
      if (!e.target.closest || !e.target.closest('[aria-label="언어 선택"]')) {
        if (!e.target.closest || !e.target.closest('a[href]')) this.setState({ langOpen: false });
      }
    };
    document.addEventListener('click', this._away, true);
    this._scroll = () => {
      const on = (window.scrollY || document.documentElement.scrollTop || 0) > 24;
      if (on !== this.state.scrolled) this.setState({ scrolled: on });
      this._publish(on);
    };
    this._publish = (on) => {
      const h = on ? 60 : (window.innerWidth < 900 ? 76 : 92);
      document.documentElement.style.setProperty('--adc-header-h', h + 'px');
    };
    window.addEventListener('resize', this._resize);
    window.addEventListener('keydown', this._esc);
    window.addEventListener('scroll', this._scroll, { passive: true });
    this._scroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._resize);
    window.removeEventListener('keydown', this._esc);
    window.removeEventListener('scroll', this._scroll);
    if (this._away) document.removeEventListener('click', this._away, true);
    if (this._sigT) clearTimeout(this._sigT);
    document.body.style.overflow = '';
  }
  componentDidUpdate() {
    document.body.style.overflow = this.state.navOpen ? 'hidden' : '';
  }

  renderVals() {
    const mobile = this.state.w < 900;
    const a = this.props.active || '';
    const big = !this.state.scrolled;
    return {
      headerH: big ? (mobile ? '76px' : '92px') : '60px',
      symSize: big ? (mobile ? '30px' : '38px') : '0px',
      symGap: big ? (mobile ? '9px' : '12px') : '0px',
      symOpacity: big ? 1 : 0,
      wordH: big ? (mobile ? '19px' : '25px') : '15px',
      isMobile: mobile,
      isDesktop: !mobile,
      navOpen: this.state.navOpen,
      toggleNav: () => this.setState((s) => ({ navOpen: !s.navOpen, sigAccOpen: false })),
      sigs: SIGS.map((s) => ({ no: s.no, ko: s.ko, href: SIG + s.key })),
      sigOpen: this.state.sigOpen,
      sigEnter: () => { if (this._sigT) clearTimeout(this._sigT); this.setState({ sigOpen: true }); },
      sigLeave: () => { this._sigT = setTimeout(() => this.setState({ sigOpen: false }), 160); },
      sigAccOpen: this.state.sigAccOpen,
      sigAccMark: this.state.sigAccOpen ? '−' : '+',
      toggleSigAcc: () => this.setState((s) => ({ sigAccOpen: !s.sigAccOpen })),
      langOpen: this.state.langOpen,
      langCode: CURRENT,
      langArrow: this.state.langOpen ? 'rotate(180deg)' : 'none',
      langBorder: this.state.langOpen ? '#2C7A6B' : '#DCE2DF',
      langBg: this.state.langOpen ? '#ECF2F0' : 'transparent',
      toggleLang: () => this.setState((s) => ({ langOpen: !s.langOpen })),
      langs: LANGS.map((l) => {
        const on = l.code === CURRENT;
        return {
          code: l.code,
          native: l.native,
          note: on ? '현재' : (l.ready ? '' : '준비 중'),
          href: (l.ready && !on) ? l.href : '#',
          tone: on ? '#2C7A6B' : (l.ready ? '#121614' : '#7C8A85'),
          chipBorder: on ? '#2C7A6B' : '#DCE2DF',
          chipBg: on ? '#ECF2F0' : 'transparent',
          pick: (e) => {
            if (!l.ready || on) { e.preventDefault(); this.setState({ langOpen: false }); return; }
            this.setState({ langOpen: false });
          }
        };
      }),
      atAbout: a === 'about',
      atSignature: a === 'signature',
      atTreatments: a === 'treatments',
      atColumn: a === 'column',
      atConcerns: a === 'concerns',
      atBa: a === 'ba'
    };
  }
}
</script>
</body>
</html>
