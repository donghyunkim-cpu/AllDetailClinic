<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
class Component extends DCLogic {
  state = { active: null };

  componentDidMount() {
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ active: null }); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._esc);
    document.body.style.overflow = '';
  }
  componentDidUpdate() {
    document.body.style.overflow = this.state.active ? 'hidden' : '';
  }

  _open(id) { return () => this.setState({ active: id }); }

  _stepProgram(dir) {
    const order = ['nasolabial','lifting','booster','pigment','body'];
    const i = order.indexOf(this.state.active);
    const n = (i < 0 ? 0 : i + dir + order.length) % order.length;
    this.setState({ active: order[n] });
  }

  renderVals() {
    const a = this.state.active;
    return {
      modalOpen: !!a,
      active: a || 'nasolabial',
      prevProgram: () => this._stepProgram(-1),
      nextProgram: () => this._stepProgram(1),
      openNaso: this._open('nasolabial'),
      openLift: this._open('lifting'),
      openBooster: this._open('booster'),
      openPigment: this._open('pigment'),
      openBody: this._open('body'),
      close: () => this.setState({ active: null })
    };
  }
}
</script>
