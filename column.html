<div style="font-family: 'SUIT Variable', system-ui, sans-serif; background: #F9FAF9; color: #121614; word-break: keep-all; text-wrap: pretty;">

  <dc-import name="Site Header" active="column" hint-size="100%,92px"></dc-import>

  <section style="padding: 92px 0 0;">
    <div style="padding: clamp(40px, 8vh, 88px) clamp(16px, 3vw, 40px) clamp(26px, 4vh, 48px); border-bottom: 1px solid #E4E9E6;">
      <p style="margin: 0 0 clamp(28px, 6vh, 64px); font-size: 10.5px; letter-spacing: 0.2em; color: #8B948F;">MEDICAL COLUMN</p>
      <h1 style="margin: 0; font-family: 'Newsreader', serif; font-weight: 200; font-size: clamp(40px, 9vw, 148px); line-height: 0.95; letter-spacing: -0.035em;">Journal<br /><span style="color: #2C7A6B;">of details</span></h1>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: clamp(24px, 4vh, 44px);">
        <p style="margin: 0; font-size: 14.5px; line-height: 1.9; color: #4C5652; max-width: 560px;">장비 이름이나 유행이 아니라, 결과를 바꾸는 판단 기준에 대해 씁니다. 원장이 직접 쓰는 기록입니다.</p>
        <p style="margin: 0; font-size: 11px; letter-spacing: 0.16em; color: #8B948F;">{{ totalLabel }}</p>
      </div>
    </div>
  </section>

  <div data-lnb-wrap style="position: sticky; top: var(--adc-header-h, 92px); z-index: 60; background: rgba(249,250,249,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #E4E9E6;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 11px clamp(16px, 3vw, 40px);">
      <div data-lnb style="display: flex; justify-content: center; gap: clamp(12px, 2vw, 26px); overflow-x: auto; flex: 1 1 auto;">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
          <button onClick="{{ c.pick }}" style="appearance: none; flex: none; border: 0; background: transparent; cursor: pointer; padding: 6px 0; font-size: 12.5px; white-space: nowrap;" style-hover="color: #2C7A6B;">
            {{ c.label }}
            <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><span style="display: block; height: 1px; margin-top: 4px; background: #2C7A6B;"></span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex: 0 1 260px; border-bottom: 1px solid #DCE2DF;">
        <span style="font-size: 11px; letter-spacing: 0.14em; color: #B2BBB7;">SEARCH</span>
        <input type="text" value="{{ query }}" onChange="{{ onSearch }}" placeholder="키워드로 찾기" style="flex: 1; min-width: 0; height: 34px; border: 0; background: transparent; font-size: 13px; outline: none;" style-focus="outline: 1px solid #2C7A6B; outline-offset: 3px;" aria-label="칼럼 검색" />
      </div>
    </div>
  </div>

  <sc-if value="{{ listMode }}" hint-placeholder-val="{{ true }}">
    <section id="list" style="padding: clamp(36px, 6vh, 72px) clamp(16px, 3vw, 40px) clamp(56px, 9vh, 110px);">
      <div style="max-width: 1560px; margin: 0 auto;">
        <p style="margin: 0 0 clamp(20px, 3vh, 32px); font-size: 11px; letter-spacing: 0.16em; color: #8B948F;">{{ resultLabel }}</p>

        <div style="border-top: 1px solid #121614;">
          <sc-for list="{{ posts }}" as="p" hint-placeholder-count="6">
            <a href="{{ p.href }}" style="width: 100%; border-bottom: 1px solid #E4E9E6; color: #121614; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: baseline; padding: clamp(20px, 3vh, 32px) 2px;" style-hover="background: #F2F5F3;">
              <span>
                <span style="display: block; margin-bottom: 10px; font-size: 10.5px; letter-spacing: 0.18em; color: #2C7A6B;">{{ p.cat }}</span>
                <span style="display: block; font-size: clamp(19px, 2.1vw, 28px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.4;">{{ p.title }}</span>
                <span style="display: block; margin-top: 10px; font-size: 13.5px; line-height: 1.85; color: #6A736F; max-width: 680px;">{{ p.excerpt }}</span>
              </span>
              <span style="font-family: 'Newsreader', serif; font-size: 13px; color: #8B948F; white-space: nowrap;">{{ p.date }}</span>
            </a>

        </div>

        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 40px 0 0; font-size: 14px; color: #8B948F;">검색 결과가 없습니다. 다른 키워드로 찾아보시거나 카테고리에서 선택해주세요.</p>

<noscript>
<!-- columns:noscript:start -->
<ul>
  <li><a href="column-nasolabial-fold.html">생기면 10년 더 늙어보여서 무조건 늦춰야 할 주름 한 가지</a> — 얼굴의 여러 주름 중 인상을 가장 크게 바꾸는 것은 팔자주름이다. 시술이 필요한 팔자인지 확인하는 법부터 유형별 진단, 나이대별 처방까지 정리했다.</li>
  <li><a href="column-dermatology-waste-of-money.html">피부과는 돈낭비다.</a> — 피부과가 효과 없다고 느끼는 데에는 이유가 있다. 목적, 유전에 대한 오해, 가성비의 기준, 시술 효과에 대한 이해, 디자인. 다섯 가지로 나눠 짚어봤다.</li>
  <li><a href="column-appearance-and-life.html">외모는 인생을 바꿀 정도로 중요할까?</a> — ‘외모보다 능력’, ‘외모보다 내면’이라는 말은 정말 맞을까. 소득과 결혼, 신용도, 삶의 만족도에서 외모가 만드는 차이를 짚어봤다.</li>
  <li><a href="column-lifting-shot-count.html">샷수는 왜 기준이 될 수 없을까</a> — 같은 600샷도 지방 두께와 피부층에 따라 완전히 다른 결과를 만든다. 숫자 대신 무엇을 봐야 하는지 정리했다.</li>
  <li><a href="column-anesthesia-waiting-time.html">마취는 기술이 아니라 기다림이다</a> — 연고를 바르는 것과 약효가 오르는 것은 다른 일이다. 통증을 줄이는 30분의 의미에 대해.</li>
  <li><a href="column-melasma-laser.html">기미가 진해지는 레이저도 있다</a> — 표피형과 진피형은 접근이 다르다. 회차마다 세팅을 다시 맞춰야 하는 이유.</li>
  <li><a href="column-skin-booster-layer.html">성분보다 층이 중요하다</a> — 리쥬란이든 쥬베룩이든, 내 피부의 어느 층에 어떻게 들어가는지가 결과를 바꾼다.</li>
  <li><a href="column-nasolabial-filler.html">팔자 주름에 필러만 넣으면 안 되는 경우</a> — 꺼짐형, 볼살형, 처짐형. 원인을 나누지 않으면 채울수록 어색해진다.</li>
  <li><a href="column-weight-loss-body-line.html">체중이 줄었는데 라인이 더 무너지는 이유</a> — 탄력에 대한 계획 없이 지방만 빼면, 빠진 자리가 흐물거리며 처진다.</li>
</ul>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
const CATS = ['전체', '리프팅', '통증과 마취', '색소', '스킨부스터', '디자인', '인사이트'];
const CAT_MAP = { '리프팅': 'LIFTING', '통증과 마취': 'COMFORT', '색소': 'PIGMENT', '스킨부스터': 'BOOSTER', '디자인': 'DESIGN', '인사이트': 'INSIGHT' };
const postHref = (p) => 'column-' + p.slug + '.html';

class Component extends DCLogic {
  state = { cat: '전체', query: '', posts: null };

  componentDidMount() {
    import('./columns-data.js').then((m) => {
      // old deep link: column.html#p3 -> that column's own page
      const hm = (window.location.hash || '').match(/^#p(\d+)$/);
      const old = hm && m.POSTS[+hm[1]];
      if (old) { window.location.replace(postHref(old)); return; }
      this.setState({ posts: m.POSTS });
    });
  }

  _filtered() {
    const q = this.state.query.trim().toLowerCase();
    return (this.state.posts || []).filter((p) => {
      const byCat = this.state.cat === '전체' || p.cat === CAT_MAP[this.state.cat];
      if (!byCat) return false;
      if (!q) return true;
      const hay = (p.title + ' ' + p.excerpt + ' ' + p.body.map((b) => b[1]).join(' ')).toLowerCase();
      return hay.indexOf(q) >= 0;
    }).sort((a, b) => b.date.localeCompare(a.date));
  }

  renderVals() {
    const ready = this.state.posts !== null;
    const list = this._filtered();
    return {
      totalLabel: ready ? this.state.posts.length + ' COLUMNS' : '',
      resultLabel: !ready ? '' : this.state.query.trim()
        ? '“' + this.state.query.trim() + '” 검색 결과 ' + list.length + '건'
        : (this.state.cat === '전체' ? '전체 ' + list.length + '건' : this.state.cat + ' ' + list.length + '건'),
      cats: CATS.map((c) => ({
        label: c,
        on: this.state.cat === c,
        pick: () => this.setState({ cat: c })
      })),
      query: this.state.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      listMode: true,
      empty: ready && list.length === 0,
      posts: list.map((p) => ({
        cat: p.cat,
        date: p.date,
        title: p.title,
        excerpt: p.excerpt,
        href: postHref(p)
      }))
    };
  }
}
</script>
